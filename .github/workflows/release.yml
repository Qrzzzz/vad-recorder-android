name: Release Android APK

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Check version and run tests
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          bash gradlew testDebugUnitTest lintDebug --console=plain
      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo 'Release signing secrets must be configured before publishing a tag.' >&2
            exit 1
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: bash gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: VADRecorder-v${{ env.APP_VERSION }}${{ env.ANDROID_KEYSTORE_PATH == '' && '-unsigned' || '' }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/VADRecorder-v${APP_VERSION}.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -F 'certificate SHA-256 digest: b2b0f013dcfa428bb6f4c3563faa204c7890f72abd6062d1cbbb155222d493c9' "$RUNNER_TEMP/apk-signature.txt"
          aapt="$(dirname "$apksigner")/aapt"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.qrz.voicetriggerrecorder'" "$RUNNER_TEMP/apk-badging.txt" | grep -F "versionName='$APP_VERSION'"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then exit 1; fi
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" "$apk" "$(dirname "$apk")/SHA256SUMS.txt" \
            --verify-tag --title "梦话录音机 v${APP_VERSION}" \
            --notes-file "docs/releases/${APP_VERSION}.md" --generate-notes
